[project]
name = "tradeops-data"
version = "0.1.0"
description = "Synthetic data generation, provenance, and allowlisted public-source adapters."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["tradeops-domain>=0.1.0"]

[tool.uv.sources]
tradeops-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeops_data"]
