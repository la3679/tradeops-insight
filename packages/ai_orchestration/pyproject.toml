[project]
name = "tradeops-ai"
version = "0.1.0"
description = "Mock-first providers, retrieval ports, and governed TradeOps workflow orchestration."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["pydantic>=2.13,<3", "tradeops-domain>=0.1.0"]

[tool.uv.sources]
tradeops-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeops_ai"]
