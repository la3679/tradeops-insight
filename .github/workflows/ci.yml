name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify web application
        run: npm run verify:web
      - name: Enforce frontend coverage
        run: npm run test:coverage
      - name: Audit production dependencies
        run: bun audit --production

  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.2
          python-version: 3.14.7
          enable-cache: true
      - name: Synchronize locked dependencies
        run: uv sync --directory backend --all-groups --locked
      - name: Check formatting
        run: uv run --directory backend --locked ruff format --check .
      - name: Lint
        run: uv run --directory backend --locked ruff check .
      - name: Check types
        run: uv run --directory backend --locked mypy src tests
      - name: Run tests
        run: uv run --directory backend --locked pytest

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.2
          python-version: 3.14.7
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --directory backend --all-groups --locked
          npx playwright install --with-deps chromium
      - name: Run critical desktop and tablet journeys
        run: npm run test:e2e

  contract-and-containers:
    name: Contracts and containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.2
          python-version: 3.14.7
      - name: Synchronize locked backend
        run: uv sync --directory backend --all-groups --locked
      - name: Validate generated OpenAPI contract
        run: uv run --directory backend --locked python ../scripts/validate_openapi.py
      - name: Validate documentation links
        run: uv run --directory backend --locked python ../scripts/check_docs.py
      - name: Run deterministic mock evaluation
        run: uv run --directory backend --locked python ../scripts/run_eval.py
      - name: Validate and build containers
        run: |
          docker compose config --quiet
          docker compose build api worker web

  terraform:
    name: Terraform reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - run: terraform -chdir=infra/terraform/aws fmt -check -recursive
      - run: terraform -chdir=infra/terraform/aws init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/aws validate
