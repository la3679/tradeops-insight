name: Bug report
description: Report a reproducible problem using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, employer material, or vulnerability details.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include sanitized commands, synthetic inputs, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
