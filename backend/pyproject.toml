[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradeops-copilot-backend"
version = "0.1.0"
description = "Typed API and worker foundation for the TradeOps Copilot portfolio project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.1",
  "celery==5.6.3",
  "fastapi==0.141.1",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "structlog==26.1.0",
  "uvicorn==0.52.4",
]

[project.scripts]
tradeops-api = "tradeops.api.__main__:main"
tradeops-worker = "tradeops.worker.__main__:main"

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.3.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/tradeops"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=tradeops --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/tradeops/**/__main__.py"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["tradeops"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "celery"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC"]
