name: tradeops-copilot

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeops}
      POSTGRES_USER: ${POSTGRES_USER:-tradeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradeops-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      TRADEOPS_ENVIRONMENT: local
      TRADEOPS_DATABASE_URL: ${TRADEOPS_DATABASE_URL:-postgresql+psycopg://tradeops:tradeops-local-only@postgres:5432/tradeops}
      TRADEOPS_WORKER_BROKER_URL: ${TRADEOPS_WORKER_BROKER_URL:-redis://redis:6379/0}
      TRADEOPS_WORKER_RESULT_BACKEND_URL: ${TRADEOPS_WORKER_RESULT_BACKEND_URL:-redis://redis:6379/1}
      TRADEOPS_OTEL_EXPORTER_ENDPOINT: ${TRADEOPS_OTEL_EXPORTER_ENDPOINT:-http://otel-collector:4317}
      TRADEOPS_OIDC_ISSUER: ${TRADEOPS_OIDC_ISSUER:-http://keycloak:8080/realms/tradeops}
      TRADEOPS_OIDC_AUDIENCE: ${TRADEOPS_OIDC_AUDIENCE:-tradeops-api}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--locked",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["uv", "run", "--locked", "--no-dev", "tradeops-worker"]
    environment:
      TRADEOPS_ENVIRONMENT: local
      TRADEOPS_WORKER_BROKER_URL: ${TRADEOPS_WORKER_BROKER_URL:-redis://redis:6379/0}
      TRADEOPS_WORKER_RESULT_BACKEND_URL: ${TRADEOPS_WORKER_RESULT_BACKEND_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-tradeops-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-tradeops-admin-local-only}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/tradeops-realm.json:/opt/keycloak/data/import/tradeops-realm.json:ro
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      TRADEOPS_API_BASE_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  prometheus-data:
  grafana-data:
