repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier check
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format check
        entry: uv run --directory backend --locked ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff
        name: Ruff lint
        entry: uv run --directory backend --locked ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --directory backend --locked mypy src tests
        language: system
        pass_filenames: false
