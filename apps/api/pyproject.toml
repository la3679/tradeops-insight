[project]
name = "tradeops-api"
version = "0.1.0"
description = "TradeOps Copilot FastAPI service and governed workflow entry point."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeops_api"]
